name: Deploy production and test to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-site

      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          path: develop-site

      - name: Prepare Pages content
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/test

          rsync -a             --exclude='.git'             --exclude='.github'             main-site/ build/

          rsync -a             --exclude='.git'             --exclude='.github'             develop-site/ build/test/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
